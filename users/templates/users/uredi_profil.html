{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-[#121212] flex items-center justify-center px-4 py-10">
    <div class="max-w-2xl w-full bg-[#161616] rounded-3xl shadow-2xl p-8 border border-gray-800">
        
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-white tracking-wide uppercase">Postavke tijela</h2>
            <p class="text-sm text-gray-500 mt-2">Dovrši svoj profil za precizne izračune kalorija</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Ime</label>
                    <input type="text" name="first_name" 
                           value="{{ form.first_name.value|default:request.user.first_name }}" 
                           class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Prezime</label>
                    <input type="text" name="last_name" 
                           value="{{ form.last_name.value|default:request.user.last_name }}" 
                           class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Godine</label>
                    <input type="number" name="godine" value="{{ form.godine.value|default:'' }}" 
                           class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Težina (kg)</label>
                    <input type="number" step="0.1" name="tezina" value="{{ form.tezina.value|default:'' }}" 
                           class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Visina (cm)</label>
                    <input type="number" name="visina" value="{{ form.visina.value|default:'' }}" 
                           class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF]">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Spol</label>
                    <select name="spol" class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF]">
                        {% for value, text in form.fields.spol.choices %}
                            <option value="{{ value }}" {% if form.spol.value == value %}selected{% endif %}>{{ text }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Tvoj cilj</label>
                    <select name="cilj" class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF]">
                        {% for value, text in form.fields.cilj.choices %}
                            <option value="{{ value }}" {% if form.cilj.value == value %}selected{% endif %}>{{ text }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Razina aktivnosti</label>
                <select name="razina_aktivnosti" class="w-full bg-[#1e1e1e] text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF]">
                    {% for value, text in form.fields.razina_aktivnosti.choices %}
                        <option value="{{ value }}" {% if form.razina_aktivnosti.value == value %}selected{% endif %}>{{ text }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Profilna slika</label>
                <input type="file" name="profilna_slika" class="w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#1e1e1e] file:text-[#00E5FF] hover:file:bg-[#252525]">
            </div>

            <button type="submit" 
                    class="w-full bg-[#00E5FF] text-black font-bold text-sm tracking-widest rounded-xl px-4 py-4 mt-4 hover:bg-cyan-400 transition-all uppercase">
                Spremi i kreni
            </button>
        </form>
    </div>
</div>
{% endblock %}
