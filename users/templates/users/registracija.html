{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-[#121212] flex items-center justify-center px-4 py-10">
    <div class="max-w-md w-full bg-[#161616] rounded-3xl shadow-2xl p-8 border border-gray-800">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#1e1e1e] rounded-2xl flex items-center justify-center mx-auto mb-4 border border-gray-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[#00E5FF]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-wide">POSTANI ČLAN</h2>
            <p class="text-sm text-gray-500 mt-2">Unesi svoje podatke za Sesto Fitness profil</p>
        </div>

        <form method="POST" action="" class="space-y-5">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Ime</label>
                    <input type="text" name="first_name" 
                           value="{{ form.first_name.value|default_if_none:'' }}" 
                           class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                           required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Prezime</label>
                    <input type="text" name="last_name" 
                           value="{{ form.last_name.value|default_if_none:'' }}" 
                           class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                           required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Username</label>
                <input type="text" name="username" 
                       value="{{ form.username.value|default_if_none:'' }}" 
                       class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                       required>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Email</label>
                <input type="email" name="email" 
                       value="{{ form.email.value|default_if_none:'' }}" 
                       class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                       required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Težina (kg)</label>
                    <input type="number" step="0.1" name="tezina" 
                           value="{{ form.tezina.value|default_if_none:'' }}" 
                           class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                           required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Visina (cm)</label>
                    <input type="number" name="visina" 
                           value="{{ form.visina.value|default_if_none:'' }}" 
                           class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                           required>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Lozinka</label>
                    <input type="password" name="password" 
                           class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                           required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Ponovi lozinku</label>
                    <input type="password" name="password_confirm" 
                           class="w-full bg-transparent text-white border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] focus:ring-1 focus:ring-[#00E5FF] transition-colors" 
                           required>
                </div>
            </div>

            {% if form.errors %}
            <div class="bg-red-900/50 border border-red-500 text-red-200 text-sm p-3 rounded-lg mt-4">
                Molimo ispravite greške u formi.
            </div>
            {% endif %}

            <button type="submit" 
                    class="w-full bg-[#00E5FF] text-black font-bold text-sm tracking-widest rounded-xl px-4 py-4 mt-6 hover:bg-cyan-400 transition-colors">
                REGISTRIRAJ SE
            </button>
            
            <div class="text-center mt-6">
                <span class="text-sm text-gray-500">Već imaš račun?</span>
                <a href="/korisnici/prijava/" class="text-sm text-white font-bold tracking-wider hover:text-[#00E5FF] ml-2">PRIJAVI SE</a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
